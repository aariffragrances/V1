# ============================================================
# Netlify Configuration — Aarif Fragrances
# ============================================================

[build]
  # Directory containing the static site assets
  publish = "frontend"

# Production security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache-Control headers for immutable assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============================================================
# Backend API Proxy (Optional for Netlify):
# If you host the FastAPI backend on Render, Railway, Fly.io, or VPS,
# uncomment the redirect block below and replace YOUR_BACKEND_URL.
# ============================================================
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL/api/:splat"
#   status = 200
#   force = true
