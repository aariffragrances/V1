<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Aarif Fragrances</title>
  <meta name="description" content="Sign in to your Aarif Fragrances account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=57">
  <link rel="icon" href="assets/aarif-logo.png" type="image/png">
</head>
<body data-page="login" class="customer-login-body">

  <div class="login-screen customer-login-screen">
    <div class="login-card customer-login-card">
      <div class="login-logo">
        <img src="assets/aarif-logo.png?v=3" alt="Aarif Fragrances" class="logo-img logo-img--auth">
        <span class="logo-brand-text logo-brand-text--auth"><span class="logo-brand-name">AARIF</span><span class="logo-brand-tag">Fragrances</span></span>
        <p>Sign In</p>
      </div>

      <form id="login-form" class="customer-login-form" novalidate>
        <div class="form-group">
          <label for="login-identifier">Email or username</label>
          <input type="text" id="login-identifier" name="login" required autocomplete="username" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="pass-wrap">
            <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="pass-toggle" data-target="login-password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <p id="login-error" class="login-error auth-error hidden" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
      </form>

      <p class="login-forgot">Don't have an account? <a href="signup.html">Create one</a></p>
      <p class="login-hint"><a href="index.html">← Back to home</a></p>
    </div>
  </div>

  <script>
    document.querySelectorAll('.pass-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.innerHTML = show ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
      });
    });
  </script>
  <script src="js/customer-api.js"></script>
  <script src="js/customer-auth.js"></script>
</body>
</html>
