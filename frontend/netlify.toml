[build]
  publish = "."
  command = "echo 'Pure static site - ready to deploy'"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,ENVIRONMENT,APP_HOST,APP_PORT,CLOUDINARY_CLOUD_NAME,CLOUDINARY_FOLDER,CLOUDINARY_UPLOAD_PRESET,DATABASE_URL,NEON_DATA_API_URL,SECRET_KEY,SESSION_EXPIRE_MINUTES,CORS_ORIGINS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
